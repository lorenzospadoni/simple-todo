<!DOCTYPE html>
<html>
    <head>
        <title>Simple Todo: Register New User</title>
        <script type='module' src="js/register.js"></script>
    </head>
    <body>
        <form id="register-form">
            <label>
                Username:
                <input name="username" label="username" id="username">
            </label>
            <label>
                Password:
                <input name="password" label="password" id="password">
            </label>
            <label>
                Confirm Password:
                <input name="confirm-password" label="confirm-password" id="confirm-password">
            </label>
            <input type="submit" value="submit">


        </form>
    </body>
</html>
